<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Progress Circle</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="progress-container">
            <div class="progress-content">
                <div class="progress-container-circle">
                    <h1 class="progress-title">Progress</h1>
                    <div class="progress-visual">
                        <svg class="svg-circles" viewBox="24 24 152 152">
                            <circle
                                class="light-circle"
                                cx="100"
                                cy="100"
                                r="70"
                            ></circle>

                            <circle
                                class="blue-circle"
                                cx="100"
                                cy="100"
                                r="70"
                                transform="rotate(-90 100 100)"
                            ></circle>
                        </svg>
                    </div>
                </div>

                <div class="progress-container-api">
                    <ul class="button-list">
                        <li class="button-element">
                            <input
                                class="progress-input"
                                type="number"
                                min="0"
                                max="100"
                                step="any"
                                inputmode="decimal"
                                value="15"
                                id="progress-value"
                                aria-describedby="value-error"
                            />
                            <label for="progress-value">Value</label>
                        </li>

                        <li class="button-element">
                            <label class="switch">
                                <input type="checkbox" id="animate" />
                                <span class="slider"></span>
                            </label>
                            <label for="animate">Animate</label>
                        </li>

                        <li class="button-element">
                            <label class="switch">
                                <input type="checkbox" id="hide" />
                                <span class="slider"></span>
                            </label>
                            <label for="hide">Hide</label>
                        </li>
                    </ul>

                    <span
                        id="value-error"
                        class="value-error"
                        role="status"
                    ></span>
                </div>
            </div>
        </main>

        <script src="progress.js"></script>
        <script src="script.js"></script>
    </body>
</html>
